---
layout: default
title: AI Literacy Resources
---
<div class="docs-section" id="ai-literacy-resources">
  <h4>AI Literacy Resources</h4>

  <div class="resource-grid">
    {% assign resources = site.ai_resources | sort: 'order' %}
    {% for r in resources %}
      <a class="resource-card" href="{{ r.url | prepend: site.baseurl }}" data-resource-name="{{ r.title | escape }}">
        <div class="resource-image">
          {% if r.image and r.image != "" %}<img src="{{ r.image | prepend: site.baseurl }}" alt="">{% else %}<i class="fa-regular fa-image"></i>{% endif %}
        </div>
        <div class="resource-body">
          <p class="title"><b>{{ r.title }}</b></p>
          <p>{{ r.card_description }}</p>
        </div>
        <i class="fa-solid fa-arrow-right resource-download"></i>
      </a>
    {% endfor %}
  </div>
</div>

<script>
  document.querySelectorAll('.resource-card[data-resource-name]').forEach(function (card) {
    card.addEventListener('click', function () {
      gtag('event', 'resource_click', {
        resource_name: card.dataset.resourceName,
        link_url: card.href
      });
    });
  });
</script>
